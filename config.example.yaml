# Copy to config.yaml and fill in real values (config.yaml is git-ignored)
app:
  name: Sport Booking
  # base of the links in invite and password-reset emails, e.g. https://booking.example.com
  frontendUrl: http://localhost:5173

server:
  port: 3000
  readTimeout: 10
  writeTimeout: 10
  # Behind a load balancer / reverse proxy: trust its client-IP header so rate limits see real users.
  # List only your proxy addresses (IP or CIDR). Leave both empty when clients connect directly.
  proxyHeader: ""            # e.g. X-Forwarded-For
  trustedProxies: []         # e.g. ["10.0.0.0/8"]

database:
  postgres:
    host: localhost
    port: 5432
    user: booking
    password: change-me
    dbname: booking
    sslmode: disable
    timezone: Asia/Vientiane

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

# secret and refreshSecret must each be exactly 32 characters (AES-256 key)
jwt:
  secret: change-me-access-secret-32-chars
  refreshSecret: change-me-refresh-secret-32-char

# File storage for uploaded pictures (logo, covers, photos).
# driver picks one section; the other sections are ignored, so you can keep all three filled in.
# Keys and secrets stay on the server: never put them in the frontend.
storage:
  driver: local           # local | r2 | supabase

  # A folder on this machine, served by the backend at /files. Back it up together with the database.
  # publicBaseUrl: leave empty when site and API share one domain (links become /files/...);
  # otherwise the backend address, e.g. http://localhost:3000/files in development.
  local:
    path: ./data/uploads
    publicBaseUrl: http://localhost:3000/files

  # Cloudflare R2 (also works with any S3-compatible service: AWS S3, Backblaze B2, DigitalOcean Spaces).
  # endpoint: R2 → bucket → Settings → S3 API (without the bucket name at the end).
  # accessKey/secretKey: R2 API token with "Object Read & Write" on this bucket only.
  # publicBaseUrl (required): the bucket's custom domain, e.g. https://files.example.com
  r2:
    endpoint: https://<account-id>.r2.cloudflarestorage.com
    region: auto
    bucket: booking-media
    accessKey: ""
    secretKey: ""
    # TESTING ONLY, before KYC the gateway takes 1 to 999 kip: 100000 sends 100,000 kip as 1 (and reads amounts back
    # multiplied). Ignored when secretKey is set. Leave 0 for real money.
    testAmountDivisor: 0
    publicBaseUrl: https://files.example.com

  # Supabase Storage. serviceKey is the server-side service_role key.
  # publicBaseUrl is optional (CDN / custom domain); empty = the Supabase public URL.
  supabase:
    projectUrl: https://<project-ref>.supabase.co
    bucket: booking-media
    serviceKey: ""
    publicBaseUrl: ""

# Sign in with Google / Facebook (customers only). Leave a provider empty to switch it off.
# Google: OAuth client id (type Web) from Google Cloud Console, with your site as an authorised JavaScript origin.
# Facebook: app id and app secret from developers.facebook.com (Facebook Login); the secret stays on the server.
social:
  googleClientId: ""
  facebookAppId: ""
  facebookAppSecret: ""

# Development: Mailpit (docker compose up -d mailpit) on localhost:1025, inbox at http://localhost:8025
# with empty username / password. Release: your SMTP provider's host, port (587 or 465) and credentials.
mailer:
  host: localhost
  username: ""
  password: ""
  port: 1025
  from: no-reply@example.com
#
# Release with Gmail (replace the block above with this, then restart):
# mailer:
#   host: smtp.gmail.com
#   port: 587
#   username: your.address@gmail.com
#   password: abcdefghijklmnop   # the 16-character App password, not your Gmail password
#   from: "Booking <your.address@gmail.com>"

# The client this install belongs to. Read on the first start only (empty database): the company
# and its owner are created from it; afterwards the owner changes everything in the app.
company:
  name: Riverside Sports
  ownerName: Owner Name
  ownerEmail: owner@example.com
  # leave empty in production: the owner gets an email with a link to choose a password
  ownerPassword: ""

# Online payment (PhaJay). Leave the keys empty to keep the QR / transfer / WhatsApp way only.
# Keys: https://portal.phajay.co (Key Management). Before KYC: testKey (calls) + devSecretKey (webhook
# signature); after approval: secretKey (both). A key may contain "$": keep the double quotes.
# Webhook URL to set in the portal: https://<your-domain>/api/v1/payments/webhooks/phajay
payments:
  phajay:
    baseUrl: "https://payment-gateway.phajay.co"
    testKey: ""
    devSecretKey: ""
    secretKey: ""
